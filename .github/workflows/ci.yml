name: DevPilot CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-qa:
    name: Backend QA & Security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"
          pip install pip-audit

      - name: Lint with Ruff
        run: |
          ruff check devpilot eval tests
          ruff format --check devpilot eval tests

      - name: Typecheck with Mypy Strict
        run: |
          mypy --strict devpilot

      - name: Run Test Suite with Coverage Gate
        run: |
          pytest --cov=devpilot --cov-report=term-missing --cov-fail-under=80 tests/

      - name: Audit Dependencies for Known Vulnerabilities
        run: |
          pip-audit --desc || echo "pip-audit completed with warnings"

      - name: Run Smoke Test
        run: |
          python scripts/smoke_test.py

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build API Dockerfile
        run: docker build -t devpilot-api -f docker/Dockerfile.api .

      - name: Build Sandbox Dockerfile
        run: docker build -t devpilot-sandbox -f docker/Dockerfile.sandbox docker/
