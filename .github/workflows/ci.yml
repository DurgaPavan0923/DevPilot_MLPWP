name: DevPilot CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-qa:
    name: Backend QA & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,full]"
          pip install pip-audit

      - name: Lint with Ruff
        run: |
          ruff check devpilot eval tests
          ruff format --check devpilot eval tests

      - name: Typecheck with Mypy Strict
        run: |
          mypy --strict devpilot

      - name: Run Test Suite with Coverage Gate
        run: |
          pytest --cov=devpilot --cov-report=term-missing --cov-fail-under=80 tests/

      - name: Run Smoke Test
        run: |
          python scripts/smoke_test.py

      - name: Audit Dependencies for Known Vulnerabilities
        continue-on-error: true
        run: |
          pip-audit --desc

  web-qa:
    name: Web QA & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web Dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck Web App
        working-directory: web
        run: pnpm typecheck

      - name: Lint Web App
        working-directory: web
        run: pnpm lint

      - name: Run Web Tests
        working-directory: web
        run: pnpm test

      - name: Build Web Application
        working-directory: web
        env:
          DOCKER_BUILD: "1"
        run: pnpm build

  docker-build:
    name: Build Docker Images
    needs: [backend-qa, web-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          load: true
          tags: devpilot-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Sandbox Docker Image
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/Dockerfile.sandbox
          load: true
          tags: devpilot-sandbox:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: web
          file: docker/Dockerfile.web
          load: true
          tags: devpilot-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test API Container Non-Root UID and Healthcheck
        run: |
          CONTAINER_UID=$(docker run --rm devpilot-api:test id -u)
          if [ "$CONTAINER_UID" = "0" ]; then
            echo "Container runs as root (UID 0)!"
            exit 1
          fi
          echo "Verified non-root container UID: $CONTAINER_UID"

          docker run -d --name test-api -p 8000:8000 devpilot-api:test

          HEALTHY=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              HEALTHY=1
              echo "API is healthy!"
              break
            fi
            sleep 1
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "Healthcheck timed out! Container logs:"
            docker logs test-api
            exit 1
          fi

          docker exec test-api python -c "import eval.runner, eval.dataset; print('Eval imports succeeded in container')"
          docker rm -f test-api

          docker compose config --quiet
