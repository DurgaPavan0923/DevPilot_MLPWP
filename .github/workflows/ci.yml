name: DevPilot CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend QA & Security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,full]"
          pip install pip-audit

      - name: Lint with Ruff
        run: |
          ruff check devpilot eval tests
          ruff format --check devpilot eval tests

      - name: Typecheck with Mypy Strict
        run: |
          mypy --strict devpilot

      - name: Run Test Suite with Coverage Gate
        run: |
          pytest --cov=devpilot --cov-report=term-missing --cov-fail-under=80 tests/

      - name: Run Smoke Test
        run: |
          python scripts/smoke_test.py

      - name: Audit Dependencies for Known Vulnerabilities
        continue-on-error: true
        run: |
          pip-audit --desc

  web-qa:
    name: Web QA & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web Dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck Web App
        working-directory: web
        run: pnpm typecheck

      - name: Lint Web App
        working-directory: web
        run: pnpm lint

      - name: Run Web Tests
        working-directory: web
        run: pnpm test

      - name: Build Web Application
        working-directory: web
        env:
          DOCKER_BUILD: "1"
        run: pnpm build

  docker-build:
    name: Build Docker Images
    needs: [backend-qa, web-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        run: docker build -t devpilot-api:test -f docker/Dockerfile.api .

      - name: Build Sandbox Docker Image
        run: docker build -t devpilot-sandbox:test -f docker/Dockerfile.sandbox docker/

      - name: Build Web Docker Image
        run: docker build -t devpilot-web:test -f docker/Dockerfile.web web/

      - name: Test API Container Non-Root UID and Healthcheck
        run: |
          CONTAINER_UID=$(docker run --rm devpilot-api:test id -u)
          if [ "$CONTAINER_UID" != "10001" ]; then
            echo "Expected non-root UID 10001, got $CONTAINER_UID"
            exit 1
          fi
          echo "Verified container non-root UID: $CONTAINER_UID"

          docker run -d --name test-api -p 8000:8000 devpilot-api:test
          sleep 5
          curl -f http://localhost:8000/api/health || (docker logs test-api && exit 1)
          docker rm -f test-api
