services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: devpilot-api
    ports:
      - "8000:8000"
    environment:
      - DEVPILOT_ENV=development
      - DEVPILOT_HOST=0.0.0.0
      - DEVPILOT_PORT=8000
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: ../docker/Dockerfile.web
    container_name: devpilot-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  sandbox:
    build:
      context: ./docker
      dockerfile: Dockerfile.sandbox
    image: devpilot-sandbox:latest
    container_name: devpilot-sandbox-base
    entrypoint: ["tail", "-f", "/dev/null"]
    healthcheck:
      test: ["CMD", "python3", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
